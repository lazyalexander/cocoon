name: Contract checks

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: cocoon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-musl
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo clippy --locked -p cocoon-guest-fixture -p cocoon-guest-helper --target aarch64-unknown-linux-musl --release -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_docs.py
      - run: python3 -m unittest discover -s experiments/microvm -p 'test_*.py' -v

  macos-runner-protocol:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and sign native runner
        run: tools/build runner
      - name: Check protocol without booting a guest
        run: python3 experiments/microvm/runner_checks.py target/cocoon-vz/cocoon-vz
      - name: Check snapshot cancellation callbacks without booting a guest
        run: python3 -m unittest discover -s experiments/microvm -p 'test_snapshot_cancellation.py' -v
