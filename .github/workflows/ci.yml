name: Contract checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s experiments/microvm -p 'test_*.py' -v

  macos-runner-protocol:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native runner
        run: swiftc -swift-version 5 -O experiments/microvm/runner.swift -o /tmp/cocoon-vz -framework Virtualization
      - name: Sign experimental runner
        run: codesign --force --sign - --entitlements experiments/macos-preflight/entitlements.plist /tmp/cocoon-vz
      - name: Check protocol without booting a guest
        run: python3 experiments/microvm/runner_checks.py /tmp/cocoon-vz
