[package]
name = "cocoon-runtime"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bounded execution contracts for agent workloads"
license = "MIT"

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.1"
uuid = { version = "1.20.0", features = ["v4", "serde"] }

[[bin]]
name = "cocoon"
path = "src/main.rs"
